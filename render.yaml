services:
  - type: web
    name: rootsage-ai-backend
    env: python
    rootDir: backend
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_NAME
        value: RootSage AI
      - key: ENVIRONMENT
        value: production
      - key: MODEL_PATH
        value: ../models/EfficientNetB0.h5
      - key: CLASS_NAMES_PATH
        value: ../models/class_names.json
      - key: MODEL_FAMILY
        value: efficientnet
      - key: IMAGE_SIZE
        value: "224"
      - key: OLLAMA_ENABLED
        value: "false"
      - key: FRONTEND_ORIGINS
        value: https://agrovision-ai-app-ten.vercel.app,https://agro-vision-ai-ochre.vercel.app
